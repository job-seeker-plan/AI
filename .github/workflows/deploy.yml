name: Deploy to k3s

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: asia-northeast3-docker.pkg.dev/aivideo-weight/planner-images/ai
  PROJECT: aivideo-weight
  DEPLOYMENT: ai
  CONTAINER: ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/580800872730/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@aivideo-weight.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # gcloud builds submit's default synchronous mode streams build logs, which
      # needs project Viewer/Owner and fails with "This tool can only stream logs
      # if you are Viewer/Owner of the project" for this deployer service account
      # even after granting roles/logging.viewer and roles/viewer - so submit async
      # and poll build status instead, which only needs cloudbuild.builds.editor
      # (already granted) and never touches log streaming.
      - name: Build and push image
        run: |
          BUILD_ID=$(gcloud builds submit --async --format="value(id)" --tag "${IMAGE}:${{ github.sha }}" --project="$PROJECT" .)
          echo "Cloud Build ID: $BUILD_ID"
          DEADLINE=$((SECONDS + 900))
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$PROJECT" --format="value(status)")
            echo "status=$STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              WORKING|QUEUED|PENDING) ;;
              *) echo "Build ended with status $STATUS"; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for Cloud Build"
              exit 1
            fi
            sleep 10
          done
          gcloud artifacts docker tags add "${IMAGE}:${{ github.sha }}" "${IMAGE}:latest" --quiet

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      # Artifact Registry pulls are authenticated with a short-lived access token
      # (no long-term key on the VM) - refresh it on every deploy so it's never
      # more than a few minutes stale when the new image gets pulled.
      - name: Refresh image pull secret
        run: |
          TOKEN=$(gcloud auth print-access-token)
          kubectl create secret docker-registry regcred \
            --docker-server=asia-northeast3-docker.pkg.dev \
            --docker-username=oauth2accesstoken \
            --docker-password="$TOKEN" \
            --docker-email=hyunji4560@gmail.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          kubectl set image "deployment/${DEPLOYMENT}" "${CONTAINER}=${IMAGE}:${{ github.sha }}"
          kubectl rollout status "deployment/${DEPLOYMENT}" --timeout=120s
